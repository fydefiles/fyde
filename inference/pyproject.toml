[project]
name = "fyde-embedding-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flask==3.1.3",
  "gunicorn==26.2.0",
  "transformers==5.22.2",
  "torch==2.15.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
