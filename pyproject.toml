[project]
name = "fyde"
version = "0.1.0"
description = "Permissioned file exchange and bounded company operations"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2.8,<5.3",
  "dj-database-url>=3,<4",
  "gunicorn>=23,<24",
  "httpx>=0.28,<0.29",
  "pillow>=12,<13",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6,<7",
  "python-dotenv>=1.1,<2",
  "stripe>=15.3,<16",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = ["ruff>=0.14,<0.16"]

[tool.ruff]
line-length = 110
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
