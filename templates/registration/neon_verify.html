{% extends 'base.html' %}
{% block title %}Verify your email · Fyde{% endblock %}
{% block content %}
<div class="auth-layout">
  <div class="eyebrow">CHECK YOUR INBOX</div>
  <h1>Verify your email.</h1>
  <p class="lead">Enter the code sent to {{ email }}.</p>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="form-card">
    {% csrf_token %}
    <label for="verification-code">Verification code</label>
    <input id="verification-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus>
    <button class="button" type="submit">Verify email <span>↗</span></button>
  </form>
  <form method="post">{% csrf_token %}<button class="text-button" name="action" value="resend">Send a new code</button></form>
  <p class="muted"><a href="{% url 'login' %}">Back to sign in</a></p>
</div>
{% endblock %}
